[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The verdict turns up rather than being asked for — that is the difference
# between a tool and a habit. Hourly rather than nightly because 10pm is a
# different instant for every user; the function serves only the people for
# whom it is currently 22:00 where they are standing.
[functions."brief-nightly"]
  schedule = "0 * * * *"

# The MCP endpoint — the whole product, as far as an AI client is concerned.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

# The two public Supabase values, so the environment variables alone are enough
# and nobody has to find snippet injection in the build settings.
[[redirects]]
  from = "/config.js"
  to = "/.netlify/functions/config"
  status = 200

# "Is this thing actually set up?" — one look instead of a tour of broken
# screens. Presence only; never a value.
[[redirects]]
  from = "/status"
  to = "/.netlify/functions/api-status"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/api-status"
  status = 200

# The record itself, readable. Everything else is arithmetic about the log;
# this is the log.
[[redirects]]
  from = "/api/log"
  to = "/.netlify/functions/api-log"
  status = 200

# The operator's view. Aggregates only — see api-admin.js for why.
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/api-admin"
  status = 200

# The rack screen. Mid-set nobody composes a sentence — they want one glance.
# Saved workouts, editable from the website as well as by talking. Both doors
# write the same rows.
[[redirects]]
  from = "/api/routines"
  to = "/.netlify/functions/api-routines"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/api-session"
  status = 200

# Which assistants are connected, and cutting one off. authorize.html has always
# promised this; now it exists.
[[redirects]]
  from = "/api/connections"
  to = "/.netlify/functions/api-connections"
  status = 200

# What plan somebody is on, and redeeming a code.
[[redirects]]
  from = "/api/membership"
  to = "/.netlify/functions/api-membership"
  status = 200

# The profile, readable and editable. Everything here was reachable through the
# assistant already; this is where somebody can go and CHECK it.
[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/api-profile"
  status = 200

# The nightly read on a lock screen. An MCP server can never speak first, so
# the phone has to carry it.
[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/api-push"
  status = 200

# The direct cloud APIs — a fidelity upgrade, never the entry price. The two
# doors (Apple Health, Health Connect) stay the answer to "connect my watch".
[[redirects]]
  from = "/api/device"
  to = "/.netlify/functions/api-device"
  status = 200

[[redirects]]
  from = "/api/device/*"
  to = "/.netlify/functions/api-device"
  status = 200

# Progress photos. Private bucket, signed URLs, and nothing ever reads the image.
[[redirects]]
  from = "/api/photos"
  to = "/.netlify/functions/api-photos"
  status = 200

# Two accounts back into one. Needs a live token for BOTH — see api-merge.js.
[[redirects]]
  from = "/api/merge"
  to = "/.netlify/functions/api-merge"
  status = 200

# Everything out, in one call. A hub you cannot leave is a trap.
[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/api-export"
  status = 200

# The hands-free door. "Hey Siri, gym bro" reaches this with the phone locked,
# carrying the same device key the HealthKit courier holds — because a locked
# phone cannot run an OAuth dance. Answers come back short: they are spoken.
[[redirects]]
  from = "/api/voice"
  to = "/.netlify/functions/api-voice"
  status = 200

# The device door. Apple Shortcuts and Health Auto Export post here.
[[redirects]]
  from = "/ingest"
  to = "/.netlify/functions/ingest"
  status = 200

# OAuth 2.1 — what makes "Sign in with Wrought" appear inside ChatGPT and Claude.
[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/oauth-token"
  status = 200

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/oauth-register"
  status = 200

[[redirects]]
  from = "/oauth/authorize-complete"
  to = "/.netlify/functions/oauth-authorize-complete"
  status = 200

# Discovery metadata is served by a function rather than as static files:
# extensionless files under /.well-known/ get an unreliable Content-Type from
# static hosting, and a client that receives text/plain here fails discovery
# with a generic connection error that tells nobody anything.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/oauth-metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "/.netlify/functions/oauth-metadata"
  status = 200
  force = true

# Agent-readable overview and connector manifest. Both need a correct
# Content-Type or the crawlers and directories that read them give up quietly.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Directories fetch the icon cross-origin to render a listing, so it needs the
# same open CORS the connector manifest gets.
[[headers]]
  for = "/icon.svg"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/.well-known/mcp.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
