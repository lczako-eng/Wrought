<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14110F">
<title>WROUGHT — loading the new interface</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
:root{--iron:#14110F;--panel:#241D1A;--edge:#4B3B33;--bright:#F7F3EE;--orange:#F26419;--gold:#F5A623;--muted:#A79A90;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--display:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(700px 430px at 70% -8%,rgba(242,100,25,.2),transparent 68%),var(--iron);color:var(--bright);font:16px/1.5 var(--display)}
main{width:min(560px,100%);border:1px solid var(--edge);background:linear-gradient(155deg,#342A25,var(--panel) 55%,var(--iron));box-shadow:0 38px 80px -38px #000,0 0 64px -34px rgba(242,100,25,.72);padding:clamp(28px,7vw,52px)}
.code{margin:0;color:var(--gold);font:800 9px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase}h1{margin:17px 0 13px;font-size:clamp(43px,12vw,72px);line-height:.84;letter-spacing:-.065em;text-transform:uppercase}p{color:var(--muted)}.rail{height:10px;margin-top:28px;border:1px solid var(--edge);overflow:hidden;background:#1B1614}.rail>i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#B8320C,var(--orange),var(--gold));transform-origin:left;animation:load 1.2s ease-in-out infinite}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:0;background:linear-gradient(135deg,var(--gold),var(--orange));color:#1A0A02;box-shadow:0 18px 34px -22px rgba(242,100,25,.95);font:800 14px var(--display);cursor:pointer}@keyframes load{0%{transform:scaleX(.05)}70%,100%{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.rail>i{transform:none}}
</style>
</head>
<body data-release="forge-03">
<main><p class="code">WROUGHT / Forge 03 / Clean handoff</p><h1>Loading the new record.</h1><p id="status">Replacing only WROUGHT’s old display files. Your sign-in, notification permission and health record stay untouched.</p><div class="rail" aria-hidden="true"><i></i></div><button id="retry" type="button" hidden>Continue to WROUGHT</button></main>
<script>
const status=document.getElementById('status'),retry=document.getElementById('retry');
const go=async()=>{try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});await Promise.race([reg.update().catch(()=>null),new Promise(resolve=>setTimeout(resolve,8000))])}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(name=>name.startsWith('wrought-shell-')&&name!=='wrought-shell-v8').map(name=>caches.delete(name)))}location.replace(`/app.html?fresh=forge-03-${Date.now()}`)}catch{status.textContent='The automatic refresh could not finish. Nothing was removed from your account.';retry.hidden=false}};
retry.addEventListener('click',go);go();
</script>
</body>
</html>
