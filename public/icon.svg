<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WROUGHT">
  <!--
    The mark is the word, so the tile is the word too — cut down to the one
    letter that still reads at 16 pixels in a browser tab. This is not a symbol
    beside the name, which was removed on purpose and stays removed; it is the
    same stamped letterform the wordmark uses, at the only size a connector
    listing gives you.

    Drawn as paths rather than <text> so it renders identically everywhere —
    a favicon that depends on a font is a favicon that is a rectangle on
    somebody else's machine.
  -->
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset=".55" stop-color="#F26419"/>
      <stop offset="1" stop-color="#C3350D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#14110F"/>

  <!-- The W: heavy, compressed, flat-cut terminals. Four strokes, no curves. -->
  <path fill="url(#heat)" d="
    M 96 132
    L 168 132
    L 200 300
    L 232 132
    L 280 132
    L 312 300
    L 344 132
    L 416 132
    L 352 380
    L 284 380
    L 256 236
    L 228 380
    L 160 380
    Z"/>

  <!-- The bar under it: the anvil line the letter is struck against. -->
  <rect x="96" y="408" width="320" height="26" rx="4" fill="#F4EFE9" opacity=".92"/>
</svg>
