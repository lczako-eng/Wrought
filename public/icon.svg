<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WROUGHT">
  <!--
    The tile is the metal and the letter is the hole punched through it — which
    is what the word means, and the reason it beats a letter sitting on a dark
    square. It also survives being shrunk: figure-ground contrast is what still
    reads at 32 pixels, once no serif is more than a pixel wide.

    Slab, not grotesque. The bracketed terminals give it a foundry register
    plate quality that a plain heavy W does not have — a plain one could belong
    to any company starting with W.

    Still not a symbol beside the name. It is the same word, cut down to the one
    letter a connector listing has room for. Drawn as paths rather than <text>,
    because a favicon depending on a font is a rectangle on somebody else's
    machine.
  -->
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset=".55" stop-color="#F26419"/>
      <stop offset="1" stop-color="#C3350D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#14110F"/>
  <rect x="56" y="56" width="400" height="400" rx="76" fill="url(#heat)"/>

  <!-- Serifs cut heavier than they would be in ink: a shape reads thinner when
       it is the hole rather than the mark. -->
  <path fill="#14110F" d="
    M104 150 L206 150 L206 178 L182 183 L212 306 L238 183 L214 178 L214 150 L298 150
    L298 178 L274 183 L304 306 L330 183 L306 178 L306 150 L408 150 L408 178 L386 184
    L330 366 L276 366 L256 268 L236 366 L182 366 L126 184 L104 178 Z"/>
</svg>
