<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrought — your record</title>
<meta name="theme-color" content="#14110F">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   The record.

   Same forge palette as the landing page, but this is a UI rather than a
   document — it gets scanned and operated, not read top to bottom. So the
   craft moves from typography to information design: the verdict and the day
   sit above the fold, detail is below it, and state is encoded in form as well
   as in number so what needs attention reads without being counted.

   The heat scale means intensity of work — matrix cells, nothing else.
   Semantic colour is kept separate from it: temper blue for recovery and
   anything neutral, moss for a target hit or a lift going up, amber for care.
   Mixing those two vocabularies is how a dashboard stops being readable.
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --iron:      #14110F;
  --scale:     #1E1917;
  --scale-2:   #262020;
  --edge:      #332B27;
  --edge-lit:  #4A3E37;

  --bright:    #F4EFE9;
  --ash:       #9A8D84;
  --ash-dim:   #6B615A;

  --heat-0:    #2A2220;
  --heat-1:    #7A1F0A;
  --heat-2:    #C3350D;
  --heat-3:    #F26419;
  --heat-4:    #F5A623;
  --heat-5:    #FFE3B8;

  --temper:    #5B90B0;
  --temper-dk: #2E4B5C;
  --moss:      #6FA672;
  --amber:     #E8B64C;

  --gut: clamp(16px, 4vw, 28px);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--iron); color: var(--bright);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--heat-3); }
:focus-visible { outline: 2px solid var(--heat-4); outline-offset: 2px; border-radius: 2px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: var(--gut); }

/* ── Chrome ─────────────────────────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--edge); padding-block: 20px 16px;
  position: sticky; top: 0; background: rgba(20,17,15,.94);
  backdrop-filter: blur(12px); z-index: 20;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; }
.mark .name { font-weight: 800; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--bright); }

.ranges { display: flex; gap: 5px; }
.range {
  font: inherit; font-size: 12.5px; font-family: var(--mono);
  padding: 6px 12px; border-radius: 3px; cursor: pointer;
  background: transparent; border: 1px solid var(--edge); color: var(--ash);
}
.range:hover { border-color: var(--edge-lit); color: var(--bright); }
.range[aria-pressed="true"] { background: var(--heat-3); border-color: var(--heat-3); color: #1A0A02; font-weight: 600; }

main { padding-block: 26px 90px; display: flex; flex-direction: column; gap: 22px; }

/* ── Panels ─────────────────────────────────────────────────────────────── */
.panel {
  background: var(--scale); border: 1px solid var(--edge); border-radius: 4px;
  padding: 20px; display: flex; flex-direction: column; gap: 14px;
}
.panel > h2 {
  margin: 0; font-size: 11px; font-family: var(--mono); font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase; color: var(--ash-dim);
}
.sub { color: var(--ash); font-size: 13.5px; margin: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 22px; }
@media (min-width: 800px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

/* ── The verdict — the one thing that isn't a number ────────────────────── */
.verdict {
  font-family: var(--serif); font-size: clamp(16px, 2.4vw, 19px); line-height: 1.6;
  border-left: 2px solid var(--heat-2); padding-left: 18px; color: var(--bright);
}
.stamp {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ash-dim);
}

/* ── Tiles ──────────────────────────────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 12px; }
.tile {
  background: var(--scale); border: 1px solid var(--edge); border-radius: 4px;
  padding: 14px 15px; display: flex; flex-direction: column; gap: 5px;
}
.tile .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash-dim); }
.tile .v { font-size: 25px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tile .s { font-size: 12px; color: var(--ash); }
.v.hot { color: var(--heat-4); } .v.cool { color: var(--temper); } .v.good { color: var(--moss); }

/* ── The ledger ─────────────────────────────────────────────────────────── */
.ledger { display: flex; flex-direction: column; gap: 11px; }
.lrow { display: grid; grid-template-columns: 54px 1fr 76px; gap: 11px; align-items: center; }
.lrow .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-dim); }
.lrow .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13.5px; text-align: right; }
.track { height: 11px; background: var(--scale-2); border-radius: 2px; overflow: hidden; }
.fill { height: 100%; border-radius: 2px; }
.fill.in  { background: linear-gradient(90deg, var(--heat-2), var(--heat-3)); }
.fill.out { background: linear-gradient(90deg, var(--temper-dk), var(--temper)); }
.net { display: flex; align-items: baseline; gap: 11px; flex-wrap: wrap; border-top: 1px solid var(--edge); padding-top: 12px; }
.net .big { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── Callouts — semantic, never the accent ──────────────────────────────── */
.callout { border-radius: 4px; padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; }
.callout .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.callout p { margin: 0; font-size: 14.5px; }
.callout.good { background: rgba(111,166,114,.08); border: 1px solid rgba(111,166,114,.3); }
.callout.good .tag { color: var(--moss); }
.callout.care { background: rgba(232,182,76,.08); border: 1px solid rgba(232,182,76,.32); }
.callout.care .tag { color: var(--amber); }
.callout.note { background: rgba(91,144,176,.07); border: 1px solid var(--temper-dk); }
.callout.note .tag { color: var(--temper); }

/* ── Charts ─────────────────────────────────────────────────────────────── */
svg { display: block; width: 100%; height: auto; overflow: visible; }
.gridline { stroke: var(--edge); stroke-width: 1; }
.axis { fill: var(--ash-dim); font-size: 10px; font-family: var(--mono); }

/* ── Lifts ──────────────────────────────────────────────────────────────── */
.lifts { display: flex; flex-direction: column; }
.lift {
  display: grid; grid-template-columns: 1fr 84px 62px; gap: 12px; align-items: center;
  padding: 13px 0; border-top: 1px solid var(--edge);
}
.lift:first-child { border-top: 0; }
.lift .nm { font-size: 14.5px; display: flex; flex-direction: column; gap: 2px; }
.lift .nm small { color: var(--ash-dim); font-size: 11.5px; font-family: var(--mono); }
.lift .spark { width: 84px; }
.lift .delta { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--moss); } .delta.down { color: var(--heat-3); } .delta.flat { color: var(--ash-dim); }

/* ── Matrix ─────────────────────────────────────────────────────────────── */
.mshell { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 3px; min-width: 420px; }
table.matrix th {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ash-dim); font-weight: 400; padding-bottom: 5px; text-align: center;
}
table.matrix th.rh, table.matrix td.rh { text-align: left; padding-right: 12px; white-space: nowrap; }
table.matrix td.rh { font-size: 13px; color: var(--ash); }
table.matrix td.rh.cold { color: var(--heat-3); }
.cell { display: block; width: 30px; height: 23px; border-radius: 2px; }
.h0{background:var(--heat-0)} .h1{background:var(--heat-1)} .h2{background:var(--heat-2)}
.h3{background:var(--heat-3)} .h4{background:var(--heat-4)}
/* Recovery runs cool. A day with no data is hatched, never shaded — a missing
   night is not a bad night, and colouring it as one would be a lie. */
.c0{background:var(--heat-0)} .c1{background:var(--temper-dk)} .c2{background:#3E6C87}
.c3{background:var(--temper)} .c4{background:#8FBAD4}
.x{background:repeating-linear-gradient(45deg,var(--scale-2),var(--scale-2) 2px,transparent 2px,transparent 4px)}
.legend { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-dim); }
.legend .ramp { display: flex; gap: 2px; }
.legend .ramp span { width: 18px; height: 7px; border-radius: 1px; }

/* ── Lists ──────────────────────────────────────────────────────────────── */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 11px 0; border-top: 1px solid var(--edge); font-size: 14px;
}
.row:first-child { border-top: 0; }
.row .when { font-family: var(--mono); font-size: 11.5px; color: var(--ash-dim); white-space: nowrap; }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 2px; border: 1px solid var(--edge); color: var(--ash-dim);
}
.chip.stale { border-color: var(--heat-1); color: var(--heat-3); }
.quote { font-family: var(--serif); font-style: italic; color: var(--ash); }

.empty { color: var(--ash-dim); font-size: 13.5px; padding: 14px 0; }

/* ── The log ───────────────────────────────────────────────────────────────
   Everything else on this page is arithmetic ABOUT the record. This is the
   record. It matters more than it looks: a product whose promise is "it
   remembers" has to let you go and look, or the memory is a claim rather than
   a fact. It is also the only place somebody catches "burrito" filed three
   weeks ago as "burrata" — invisible in an average, obvious in a log. */
.day { border-top: 1px solid var(--edge); padding-block: 18px; }
.day:first-child { border-top: 0; }
.dayhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.dayhead .d { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--bright); }
.dayhead .ago { font-family: var(--mono); font-size: 11px; color: var(--ash-dim); }
.dayhead .tot { font-family: var(--mono); font-size: 11.5px; color: var(--ash); margin-left: auto; }

.ent { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding-block: 7px; align-items: baseline; }
.ent .tm { font-family: var(--mono); font-size: 11px; color: var(--ash-dim); font-variant-numeric: tabular-nums; }
.ent .bd { min-width: 0; }
.ent .macros { font-family: var(--mono); font-size: 11px; color: var(--ash-dim); margin-top: 2px; }
.ent .cats { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.cat {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 2px; border: 1px solid var(--edge); color: var(--ash-dim);
}

/* A workout read back as forty flat rows is unreadable. Read back as exercises
   with their sets underneath, it is the session you actually did. */
.sesh { border: 1px solid var(--edge); border-radius: 3px; margin: 6px 0 2px; overflow: hidden; }
.sesh > summary {
  padding: 10px 13px; cursor: pointer; background: var(--scale-2);
  font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  list-style: none;
}
.sesh > summary::-webkit-details-marker { display: none; }
.sesh > summary::before { content: "▸"; color: var(--heat-3); font-size: 11px; }
.sesh[open] > summary::before { content: "▾"; }
.sesh > summary .meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ash-dim); }
.exs { padding: 4px 13px 12px; }
.ex { padding-block: 9px; border-top: 1px solid var(--edge); }
.ex:first-child { border-top: 0; }
.ex .nm { font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; }
.ex .nm .vol { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ash-dim); }
.setlist { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.setpill {
  font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums;
  padding: 3px 8px; border-radius: 2px; background: var(--scale-2);
  border: 1px solid var(--edge); color: var(--bright);
}
.setpill.best { border-color: var(--heat-2); color: var(--heat-4); }
.setpill .rpe { color: var(--ash-dim); }
.setnote {
  font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ash);
  margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--edge-lit);
}
.more { display: flex; justify-content: center; padding: 22px 0 4px; }

/* ── Sign in ────────────────────────────────────────────────────────────── */
.gate { max-width: 380px; margin: 90px auto; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.gate input, .gate button {
  font: inherit; width: 100%; padding: 12px 14px; border-radius: 3px;
}
.gate input { background: var(--scale); border: 1px solid var(--edge); color: var(--bright); }
.gate button { background: var(--heat-3); border: 0; color: #1A0A02; font-weight: 650; cursor: pointer; }
.msg { color: var(--ash); font-size: 13px; min-height: 19px; }

@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div id="gate" class="wrap" hidden>
  <div class="gate">
    <div class="mark" style="justify-content:center"><span class="name">Wrought</span></div>
    <p class="sub" style="margin-bottom:8px">Your record. Same account your AI uses.</p>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="send">Email me a link</button>
    <p class="msg" id="msg"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap bar">
      <div class="mark"><span class="name">Wrought</span></div>
      <div class="ranges" role="group" aria-label="View">
        <button class="range view" data-view="record" aria-pressed="true">Record</button>
        <button class="range view" data-view="log" aria-pressed="false">Log</button>
      </div>
      <div class="ranges" id="rangebtns" role="group" aria-label="Time range">
        <button class="range" data-days="7"   aria-pressed="false">7d</button>
        <button class="range" data-days="30"  aria-pressed="true">30d</button>
        <button class="range" data-days="90"  aria-pressed="false">90d</button>
        <button class="range" data-days="365" aria-pressed="false">1y</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="content"></main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = window.WROUGHT_SUPABASE_URL  || '';
const SUPABASE_ANON = window.WROUGHT_SUPABASE_ANON || '';
const sb = SUPABASE_URL ? createClient(SUPABASE_URL, SUPABASE_ANON) : null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const n = v => (v == null ? '—' : Number(v).toLocaleString());

let days = 30;
let view = 'record';
let logCursor = null;
let logDays = [];

// ?demo=1 renders the whole dashboard from invented-but-plausible data.
// A dashboard is impossible to judge empty, and nobody signs up for a product
// whose main screen they have never seen. Same render path as the real thing,
// so the demo can never drift from what people actually get.
const DEMO = new URLSearchParams(location.search).has('demo');

async function boot() {
  if (DEMO) { $('app').hidden = false; refresh(); return; }
  if (!sb) { $('gate').hidden = false; $('msg').textContent = 'This deploy is missing its Supabase keys.'; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('gate').hidden = false; return; }
  $('app').hidden = false;
  load(data.session.access_token);
}

$('send')?.addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return;
  $('msg').textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
  $('msg').textContent = error ? error.message : 'Check your email — the link signs you in.';
});

document.querySelectorAll('.range[data-days]').forEach(b => b.addEventListener('click', async () => {
  document.querySelectorAll('.range[data-days]').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  days = +b.dataset.days;
  refresh();
}));

document.querySelectorAll('.range.view').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.range.view').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  view = b.dataset.view;
  // The range buttons only mean something on the record; the log paginates by
  // day and loads more on demand.
  $('rangebtns').style.display = view === 'log' ? 'none' : '';
  logCursor = null; logDays = [];
  refresh();
}));

async function refresh() {
  if (view === 'log') return loadLog(true);
  if (DEMO) { render(demoData()); return; }
  const { data } = await sb.auth.getSession();
  if (data.session) load(data.session.access_token);
}

// ── The log ───────────────────────────────────────────────────────────────

async function loadLog(reset) {
  if (reset) { $('content').innerHTML = '<p class="empty">Loading…</p>'; logDays = []; logCursor = null; }

  let page;
  if (DEMO) {
    page = demoLog(logCursor);
  } else {
    const { data } = await sb.auth.getSession();
    if (!data.session) return;
    const qs = `days=14${logCursor ? `&before=${logCursor}` : ''}`;
    const res = await fetch(`/.netlify/functions/api-log?${qs}`, {
      headers: { Authorization: `Bearer ${data.session.access_token}` },
    });
    if (!res.ok) { $('content').innerHTML = '<p class="empty">Could not load the log.</p>'; return; }
    page = await res.json();
  }

  logDays = logDays.concat(page.days.filter(d => !d.empty));
  logCursor = page.next_before;
  renderLog(page);
}

function renderLog(page) {
  if (!logDays.length) {
    $('content').innerHTML = `<section class="panel"><h2>The log</h2>
      <p class="empty">Nothing logged yet. Say one sentence to your AI and it starts here.</p></section>`;
    return;
  }

  const out = [`<section class="panel"><h2>The log</h2>
    <p class="sub">Every entry, exactly as it went in. This is where a mis-heard word from
      three weeks ago gets caught — invisible in an average, obvious here.</p>
    <div>${logDays.map(dayBlock).join('')}</div>
    <div class="more"><button class="range" id="loadmore">Load earlier</button></div>
  </section>`];

  $('content').innerHTML = out.join('');
  $('loadmore')?.addEventListener('click', () => loadLog(false));
  // <details> keeps its own open state, so nothing to wire for the sessions.
}

function dayBlock(d) {
  const t = d.totals;
  const totals = t.calories
    ? `${n(t.calories)} kcal · ${n(t.protein_g)}p · ${n(t.carbs_g)}c · ${n(t.sugar_g)} sugar · ${n(t.fat_g)}f`
    : '';

  const food = d.food.map(f => `<div class="ent">
    <span class="tm">${esc(f.at)}</span>
    <span class="bd">${esc(f.summary)}${f.estimated ? ' <span class="cat">est</span>' : ''}
      ${f.calories ? `<div class="macros">${n(f.calories)} kcal · ${n(f.protein_g)}g protein · ${n(f.carbs_g)}g carbs · ${n(f.sugar_g)}g sugar · ${n(f.fat_g)}g fat</div>` : ''}
      ${f.categories?.length ? `<div class="cats">${f.categories.map(c => `<span class="cat">${esc(c.replace('_', ' '))}</span>`).join('')}</div>` : ''}
    </span></div>`).join('');

  const work = d.workouts.map(w => sessionBlock(w)).join('');

  const body = d.body.map(b => `<div class="ent">
    <span class="tm">${esc(b.at)}</span>
    <span class="bd">${esc(b.kind === 'measurement' ? `${b.site} — ${b.value}` : b.value)}</span>
  </div>`).join('');

  const other = d.other.map(o => `<div class="ent">
    <span class="tm">${esc(o.at)}</span>
    <span class="bd">${esc(o.summary)} <span class="cat">${esc(o.kind)}</span></span>
  </div>`).join('');

  const dev = [];
  if (d.device.sleep_say) dev.push(`slept ${d.device.sleep_say}`);
  if (d.device.steps) dev.push(`${n(Math.round(d.device.steps))} steps`);
  if (d.device.resting_hr) dev.push(`${Math.round(d.device.resting_hr)} bpm resting`);
  if (d.device.active_calories) dev.push(`${n(Math.round(d.device.active_calories))} kcal moved`);

  return `<div class="day">
    <div class="dayhead">
      <span class="d">${esc(d.weekday)} ${esc(d.date)}</span>
      <span class="ago">${d.days_ago === 0 ? 'today' : d.days_ago === 1 ? 'yesterday' : `${d.days_ago}d ago`}</span>
      ${totals ? `<span class="tot">${esc(totals)}</span>` : ''}
    </div>
    ${dev.length ? `<div class="ent"><span class="tm">·</span><span class="bd" style="color:var(--temper)">${esc(dev.join(' · '))}</span></div>` : ''}
    ${work}${food}${body}${other}
  </div>`;
}

// A session read back as forty flat rows is unreadable. Grouped into exercises
// with their sets underneath, it is the workout you actually did.
function sessionBlock(w) {
  if (!w.exercises?.length) {
    return `<div class="ent"><span class="tm">${esc(w.at)}</span>
      <span class="bd">${esc(w.summary)}${w.minutes ? ` <span class="cat">${w.minutes}m</span>` : ''}</span></div>`;
  }
  const exs = w.exercises.map(e => {
    const best = e.top;
    return `<div class="ex">
      <div class="nm">${esc(e.exercise)}
        ${e.volume ? `<span class="vol">${n(e.volume)}kg volume</span>` : ''}</div>
      <div class="setlist">${e.sets.map(st => `<span class="setpill${
        best && st.n === best.n && st.weight === best.weight ? ' best' : ''}">${
        st.weight != null ? `${st.weight}×${st.reps ?? '?'}` : `${st.reps ?? '?'} reps`
      }${st.rpe ? ` <span class="rpe">@${st.rpe}</span>` : ''}</span>`).join('')}</div>
      ${e.sets.filter(st => st.note).map(st =>
        `<div class="setnote">“${esc(st.note)}”</div>`).join('')}
    </div>`;
  }).join('');

  return `<details class="sesh"${w.days_ago === 0 ? ' open' : ''}>
    <summary>${esc(w.name || w.summary)}
      ${w.incomplete ? '<span class="cat">unfinished</span>' : ''}
      <span class="meta">${esc(w.at)}${w.minutes ? ` · ${w.minutes}m` : ''}${
        w.volume_kg ? ` · ${n(w.volume_kg)}kg` : ''}</span></summary>
    <div class="exs">${exs}${w.note ? `<div class="setnote">“${esc(w.note)}”</div>` : ''}</div>
  </details>`;
}

// Demo log — the same shape api-log.js returns, so the render path is identical.
function demoLog(cursor) {
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const end = cursor ? new Date(cursor + 'T00:00:00Z').getTime() : Date.now();
  const wave = (i, p, a) => Math.sin(i / p) * a;

  const MEALS = [
    ['08:14', 'two eggs and black coffee', 180, 13, 1, 0, 14, ['egg']],
    ['12:40', 'chicken burrito bowl, no rice', 640, 52, 44, 6, 24, ['meat','vegetable','dairy','legume']],
    ['16:05', 'greek yoghurt and berries', 210, 18, 22, 16, 5, ['dairy','fruit']],
    ['20:10', 'salmon, potatoes, broccoli', 720, 48, 61, 5, 30, ['fish','vegetable']],
  ];

  const LIFTS = {
    'Leg day': [
      ['Back Squat', [[95,6],[95,6],[95,5],[95,4]], 'left knee grumbled on the last set'],
      ['Romanian Deadlift', [[80,8],[80,8],[80,7]], null],
      ['Leg Press', [[180,10],[180,10],[180,9]], null],
      ['Calf Raise', [[60,15],[60,14]], null],
    ],
    'Push A': [
      ['Bench Press', [[82.5,8],[82.5,7],[82.5,6]], 'felt light today, bar speed was quick'],
      ['Overhead Press', [[52.5,6],[52.5,6],[52.5,5]], null],
      ['Dip', [[null,12],[null,10]], null],
      ['Tricep Extension', [[25,12],[25,12]], null],
    ],
    'Pull A': [
      ['Deadlift', [[142.5,5],[142.5,5],[142.5,4]], 'grip went before the legs did'],
      ['Barbell Row', [[77.5,8],[77.5,8],[77.5,7]], null],
      ['Pull-up', [[null,9],[null,8],[null,7]], null],
      ['Bicep Curl', [[17.5,12],[17.5,11]], null],
    ],
  };
  const NAMES = Object.keys(LIFTS);

  const days = Array.from({ length: 14 }, (_, k) => {
    const i = 13 - k;
    const date = iso(end - i * 86400000);
    const dow = new Date(date + 'T00:00:00Z').getUTCDay();
    const trains = [1, 2, 4, 6].includes(dow);
    const missed = (i + (cursor ? 3 : 0)) % 11 === 5;
    const name = NAMES[(i + dow) % NAMES.length];

    const food = missed ? [] : MEALS.slice(0, dow === 6 ? 4 : 3).map(([at, sum, c, p, cb, sg, f, cats]) => ({
      at, summary: sum, estimated: true, calories: c, protein_g: p,
      carbs_g: cb, sugar_g: sg, fat_g: f, categories: cats,
    }));

    const totals = food.reduce((a, f) => ({
      calories: a.calories + f.calories, protein_g: a.protein_g + f.protein_g,
      carbs_g: a.carbs_g + f.carbs_g, sugar_g: a.sugar_g + f.sugar_g,
      fat_g: a.fat_g + f.fat_g, estimated: true,
    }), { calories: 0, protein_g: 0, carbs_g: 0, sugar_g: 0, fat_g: 0, estimated: false });

    const exercises = trains ? LIFTS[name].map(([ex, sets, note], xi) => ({
      exercise: ex, position: xi + 1,
      sets: sets.map(([wt, reps], si) => ({
        n: si + 1, reps, weight: wt,
        rpe: si === sets.length - 1 ? 9 : 7 + si * 0.5,
        note: si === sets.length - 1 ? note : null,
      })),
      volume: Math.round(sets.reduce((a, [wt, reps]) => a + (wt || 0) * reps, 0)),
      top: { n: 1, weight: sets[0][0], reps: sets[0][1] },
    })) : [];

    return {
      date,
      weekday: new Date(date + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' }),
      days_ago: cursor ? i + 14 : i,
      totals,
      food,
      workouts: trains ? [{
        at: '18:22', name, kind: 'strength', summary: name,
        minutes: 44 + (dow % 3) * 6,
        volume_kg: exercises.reduce((a, e) => a + e.volume, 0),
        muscles: [], exercises, note: null,
      }] : [],
      body: missed ? [] : [{ at: '08:15', kind: 'weight', value: `${Math.round((82.9 - (13 - i) * 0.03 + wave(i, 3, .4)) * 10) / 10} kg` }],
      other: [],
      device: {
        sleep_minutes: Math.round(402 + wave(i, 4, 44)),
        sleep_say: `${Math.floor((402 + wave(i, 4, 44)) / 60)}h ${Math.round((402 + wave(i, 4, 44)) % 60)}m`,
        steps: Math.round(8800 + wave(i, 3.4, 3000)),
        resting_hr: Math.round(55 + wave(i, 6, 4)),
        active_calories: Math.round(690 + wave(i, 5, 220)),
      },
      empty: missed && !trains,
    };
  }).reverse();

  return { from: days[days.length - 1].date, to: days[0].date, days,
           units: 'metric', weight_unit: 'kg',
           next_before: iso(end - 14 * 86400000), has_more: true };
}

// Deterministic, so the page looks the same every time somebody opens it, and
// deliberately imperfect: missed days, a stalled lift, legs abandoned five
// weeks ago. A demo where everything goes up is not a demo of an honest app.
function demoData() {
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const end = Date.now();
  const N = days;
  const wave = (i, p, a) => Math.sin(i / p) * a;

  const series = Array.from({ length: N }, (_, i) => {
    const date = iso(end - (N - 1 - i) * 86400000);
    const dow = new Date(date).getUTCDay();
    const missed = i % 11 === 5 || i % 17 === 9;        // real people miss days
    const trained = !missed && (dow === 1 || dow === 2 || dow === 4 || dow === 6);
    return {
      date, missed, trained,
      weight: Math.round((84 - (i / N) * 1.7 + wave(i, 3.2, 0.45)) * 10) / 10,
      calories: missed ? null : Math.round(2080 + wave(i, 4, 260) + (dow === 6 ? 420 : 0)),
      protein: missed ? null : Math.round(146 + wave(i, 5, 22)),
      volume: trained ? Math.round(6400 + wave(i, 6, 1500) + i * 22) : null,
      sleep: Math.round(408 + wave(i, 4.5, 46)),
    };
  });

  const pt = (k) => series.map(d => ({ date: d.date, value: d[k] }));
  const logged = series.filter(d => !d.missed).length;
  const trainedDays = series.filter(d => d.trained).length;

  // Weeks for the matrix, with legs going cold five weeks in.
  const weeks = [...new Set(series.map(d => {
    const dt = new Date(d.date); dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7));
    return dt.toISOString().slice(0, 10);
  }))];
  const muscles = ['chest', 'back', 'shoulders', 'arms', 'legs', 'core', 'full body'];
  const grid = weeks.map((wk, wi) => ({
    week: wk,
    counts: Object.fromEntries(muscles.map(m => {
      if (m === 'legs') return [m, wi < weeks.length - 5 ? 2 : 0];
      if (m === 'full body') return [m, wi >= weeks.length - 4 ? 2 : 1];
      if (m === 'core') return [m, 1];
      return [m, 2 + (wi % 2)];
    })),
  }));

  const lift = (name, from, to, sessions) => ({
    name, sessions,
    best: { weight: Math.max(from, to), reps: 6, date: series[series.length - 2].date },
    latest: { weight: to, reps: 6, date: series[series.length - 1].date },
    change: Math.round((to - from) * 10) / 10,
    series: Array.from({ length: sessions }, (_, i) => ({
      date: series[Math.floor(i * (N - 1) / (sessions - 1))].date,
      value: Math.round((from + (to - from) * (i / (sessions - 1)) + wave(i, 2.5, 1.2)) * 4) / 4,
    })),
  });

  return {
    from: series[0].date, to: series[N - 1].date, span_days: N,
    units: 'metric', weight_unit: 'kg',
    today: {
      date: series[N - 1].date,
      food: { say: 'Roughly 2,140 kcal · 148g protein · 196g carbs · 71g fat (estimated from what you described)', estimated: true },
      training: { say: '1 session, 44 min — legs, glutes, core' },

      device: { steps: 9840, active_calories: 740, sleep_minutes: 402 },
      entries: [
        { at: '08:14', summary: 'two eggs and black coffee', estimated: true },
        { at: '08:15', summary: '82.4 kg', estimated: false },
        { at: '12:40', summary: 'chicken burrito bowl, no rice', estimated: true },
        { at: '18:22', summary: 'Leg day — 19 sets, 44 min', estimated: false },

      ],
      balance: {
        known: true, calories_in: 2140, resting_burn: 1770, active_burn: 740,
        calories_out: 2510, net: -370, direction: 'deficit',
        projected_kg_per_week: -0.34, approximate: true,
      },
    },
    earned_room: { available: true, room_kcal: 1420, logged_days: 6, worth: 'a proper meal out, whatever you actually want' },
    summary: {

      training_days: trainedDays,

    return {
      meals, days_logged: dayz, estimated: true,
      calories: cal * (dayz || 1), calories_per_day: cal,
      protein_g: pro * (dayz || 1), protein_g_per_day: pro,
      carbs_g: carb * (dayz || 1), carbs_g_per_day: carb,
      sugar_g: sug * (dayz || 1), sugar_g_per_day: sug,
      fibre_g: fib * (dayz || 1), fibre_g_per_day: fib,
      fat_g: fat * (dayz || 1), fat_g_per_day: fat,
    };

  function macroRow(key, label, avg, bands) {
    return {
      key, label, avg_per_day: avg,
      cells: bands.map((b, i) => ({
        week: iso(end - (11 - i) * 7 * 86400000),
        value: Math.round(avg * (0.82 + b * 0.09)), band: b,
      })),
    };
  }

  function devRow(metric, label, scale, values, better) {
    const present = values.filter(v => v != null);
    const min = Math.min(...present), max = Math.max(...present);
    return {
      metric, label, scale, better,
      min: Math.round(min), max: Math.round(max),
      avg: Math.round(present.reduce((a, b) => a + b, 0) / present.length),
      coverage: Math.round(present.length / values.length * 100),
      cells: values.map((v, i) => ({
        date: series[i].date, value: v,
        band: v == null ? null : Math.max(0, Math.min(4, Math.round(
          ((better === 'low' ? 1 - (v - min) / (max - min || 1) : (v - min) / (max - min || 1))) * 4))),
      })),
    };
  }
}

async function load(token) {
  $('content').innerHTML = '<p class="empty">Loading…</p>';
  const res = await fetch(`/.netlify/functions/api-progress?days=${days}`, { headers: { Authorization: `Bearer ${token}` } });
  // The generic message was a dead end during setup: a misconfigured key, an
  // expired session and a broken query all read identically. The status and the
  // server's own words are the difference between a guess and a fix.
  if (!res.ok) {
    const detail = await res.text().catch(() => '');
    $('content').innerHTML = `<p class="empty">Could not load. Try signing in again.<br><small>${res.status} ${esc(detail).slice(0, 400)}</small></p>`;
    return;
  }
  render(await res.json());
}

function render(d) {
  const s = d.summary, wu = d.weight_unit, out = [];

  for (const f of (d.care_flags || [])) {
    out.push(callout('care', 'Worth pausing on', esc(f.detail)));
  }

  // Summary before detail: the verdict and today, then everything else.
  if (d.latest_verdict?.verdict) {
    out.push(`<section class="panel">
      <span class="stamp">${esc(d.latest_verdict.kind)} read · ${esc(d.latest_verdict.local_date)}</span>
      <p class="verdict">${esc(d.latest_verdict.verdict)}</p>
    </section>`);
  }

  if (d.earned_room?.available) {
    out.push(callout('good', 'Earned',
      `You're about <strong>${n(d.earned_room.room_kcal)}</strong> calories under for the week across
       ${d.earned_room.logged_days} logged days. That's ${esc(d.earned_room.worth)}. Spend it.`));
  }

  out.push(`<div class="tiles">
    ${tile('Weight', s.weight.last != null ? `${s.weight.last}${wu}` : '—', trendWord(s.weight, wu), s.weight.direction === 'down' ? 'cool' : '')}
    ${tile('Streak', s.current_streak, `best ${s.longest_streak}`, s.current_streak >= 7 ? 'hot' : '')}
    ${tile('Logged', `${s.adherence_pct}%`, `${s.days_logged} of ${s.span_days} days`)}
    ${tile('Sessions', s.training_days, s.sessions_per_week ? `${s.sessions_per_week}/week` : 'none logged')}
    ${tile('Protein', s.protein_avg ? `${s.protein_avg}g` : '—', 'avg per logged day', 'good')}
    ${tile('Sleep', s.sleep_avg_say || '—', 'nightly average', 'cool')}
  </div>`);

  out.push(`<div class="grid-2">
    ${todayPanel(d)}
    ${balancePanel(d)}
  </div>`);

  out.push(`<div class="grid-2">
    ${chart('Weight', s.weight.say, d.series.weight, 'var(--heat-3)', wu)}
    ${chart('Protein', 'Grams per day. Gaps are unlogged days.', d.series.protein, 'var(--moss)', 'g')}
  </div>`);

  out.push(`<div class="grid-2">
    ${chart('Calories', 'Estimated from what you described.', d.series.calories, 'var(--temper)', 'kcal')}
    ${bars('Training volume', 'Sets × reps × load, per session.', d.series.volume)}
  </div>`);

  out.push(liftsPanel(d));
  out.push(matrixPanel(s.matrix));
  out.push(nutritionPanel(d.nutrition));
  out.push(devicePanel(d.device_matrix));
  out.push(weekPanel(d.weekday));

  if (d.exercise_order?.findings?.length) {
    const f = d.exercise_order.findings[0];
    out.push(callout('note', 'Order is costing you',
      `<strong>${esc(f.exercise)}</strong> averages ${f.early_avg_kg}${wu} when it goes first or second,
       and ${f.late_avg_kg}${wu} when it goes third or later — ${f.cost_kg}${wu}, about ${f.cost_pct}%. Move it up.`));
  }

  out.push(`<div class="grid-2">${sessionsPanel(d)}${routinesPanel(d)}</div>`);
  if (d.notes?.length) out.push(notesPanel(d));

  $('content').innerHTML = out.join('');
}

const tile = (k, v, s, cls = '') =>
  `<div class="tile"><span class="k">${esc(k)}</span><span class="v ${cls}">${esc(v)}</span><span class="s">${esc(s)}</span></div>`;

const callout = (kind, tag, html) =>
  `<div class="callout ${kind}"><span class="tag">${esc(tag)}</span><p>${html}</p></div>`;

const trendWord = (w, u) =>
  w.per_week_kg == null ? 'no trend yet'
  : w.direction === 'flat' ? 'holding steady'
  : `${w.direction} ${Math.abs(w.per_week_kg)}${u === 'lb' ? 'kg' : u}/wk`;

function todayPanel(d) {
  const t = d.today;
  const rows = (t.entries || []).map(e =>
    `<div class="row"><span>${esc(e.summary)}${e.estimated ? ' <span class="chip">est</span>' : ''}</span>
     <span class="when">${esc(e.at)}</span></div>`).join('');
  return `<section class="panel">
    <h2>Today · ${esc(t.date)}</h2>
    <p class="sub">${esc(t.food.say)}</p>
    <p class="sub">${esc(t.training.say)}</p>
    <div class="rows">${rows || '<p class="empty">Nothing logged yet today.</p>'}</div>
  </section>`;
}

function balancePanel(d) {
  const b = d.today.balance;
  if (!b?.known) {
    return `<section class="panel"><h2>In vs out</h2>
      <p class="empty">${esc(b?.say || 'Not enough profile detail to work this out yet.')}</p></section>`;
  }
  const max = Math.max(b.calories_in, b.calories_out) || 1;
  const net = b.net;
  const cls = net < -150 ? 'good' : net > 150 ? 'hot' : '';
  return `<section class="panel">
    <h2>In vs out · today</h2>
    <div class="ledger">
      <div class="lrow"><span class="lbl">In</span>
        <span class="track"><span class="fill in" style="width:${(b.calories_in / max * 100).toFixed(1)}%"></span></span>
        <span class="val">${n(b.calories_in)}</span></div>
      <div class="lrow"><span class="lbl">Out</span>
        <span class="track"><span class="fill out" style="width:${(b.calories_out / max * 100).toFixed(1)}%"></span></span>
        <span class="val">${n(b.calories_out)}</span></div>
      <p class="sub" style="font-family:var(--mono);font-size:11.5px">
        ${n(b.resting_burn)} at rest · ${n(b.active_burn)} moved</p>
      <div class="net">
        <span class="big ${cls}">${net > 0 ? '+' : ''}${n(net)}</span>
        <span class="sub">${b.direction}${b.projected_kg_per_week ? ` · about ${Math.abs(b.projected_kg_per_week)}kg a week` : ''}</span>
      </div>
    </div>
    <p class="sub" style="font-size:12px">Both halves are estimates. Correct against the weekly scale trend, never one day.</p>
  </section>`;
}

// Charts are hand-drawn SVG: no dependency, no CDN, and total control over the
// one thing that matters — gaps stay gaps. A day you did not log is not a zero,
// and joining across it draws a line that never happened.
function chart(title, sub, series, colour, unit) {
  const pts = series.filter(p => p.value != null);
  if (pts.length < 2) return `<section class="panel"><h2>${esc(title)}</h2><p class="empty">Not enough data yet.</p></section>`;

  const W = 460, H = 150, P = { t: 10, r: 8, b: 20, l: 38 };
  const vals = pts.map(p => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) * 0.15 || Math.abs(max * 0.05) || 1;
  min -= pad; max += pad;

  const N = series.length - 1;
  const x = i => P.l + (i / N) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);

  let path = '', pen = false;
  series.forEach((p, i) => {
    if (p.value == null) { pen = false; return; }
    path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)} `;
    pen = true;
  });

  const last = series.reduce((a, p, i) => (p.value != null ? i : a), -1);
  const ticks = [min, (min + max) / 2, max];

  return `<section class="panel"><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} over time">
      ${ticks.map(t => `<line class="gridline" x1="${P.l}" y1="${y(t).toFixed(1)}" x2="${W - P.r}" y2="${y(t).toFixed(1)}"/>
        <text class="axis" x="${P.l - 6}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`).join('')}
      <path d="${path.trim()}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${last >= 0 ? `<circle cx="${x(last).toFixed(1)}" cy="${y(series[last].value).toFixed(1)}" r="3.5" fill="${colour}"/>` : ''}
      <text class="axis" x="${P.l}" y="${H - 4}">${esc(series[0].date.slice(5))}</text>
      <text class="axis" x="${W - P.r}" y="${H - 4}" text-anchor="end">${esc(series[series.length - 1].date.slice(5))}</text>
    </svg></section>`;
}

function bars(title, sub, series) {
  const vals = series.filter(p => p.value != null).map(p => p.value);
  if (!vals.length) return `<section class="panel"><h2>${esc(title)}</h2><p class="empty">No training logged in this stretch.</p></section>`;
  const W = 460, H = 150, P = { t: 10, r: 8, b: 20, l: 38 };
  const max = Math.max(...vals) * 1.12;
  const N = series.length;
  const bw = Math.max(1.5, (W - P.l - P.r) / N - 1.5);
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);

  return `<section class="panel"><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="training volume per day">
      <line class="gridline" x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}"/>
      <text class="axis" x="${P.l - 6}" y="${P.t + 4}" text-anchor="end">${Math.round(max)}</text>
      ${series.map((p, i) => p.value ? `<rect x="${(P.l + (i / N) * (W - P.l - P.r)).toFixed(1)}"
        y="${y(p.value).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - P.b - y(p.value)).toFixed(1)}"
        fill="var(--heat-2)" rx="1"/>` : '').join('')}
      <text class="axis" x="${P.l}" y="${H - 4}">${esc(series[0].date.slice(5))}</text>
      <text class="axis" x="${W - P.r}" y="${H - 4}" text-anchor="end">${esc(series[series.length - 1].date.slice(5))}</text>
    </svg></section>`;
}

// The question people actually open a training app to ask: is anything going up?
function liftsPanel(d) {
  if (!d.lifts?.length) {
    return `<section class="panel"><h2>Lifts</h2>
      <p class="empty">Run a couple of sessions and every lift shows its own curve here.</p></section>`;
  }
  const rows = d.lifts.slice(0, 12).map(l => {
    const cls = l.change == null ? 'flat' : l.change > 0 ? 'up' : l.change < 0 ? 'down' : 'flat';
    const sign = l.change > 0 ? '+' : '';
    return `<div class="lift">
      <span class="nm">${esc(l.name)}<small>best ${l.best.weight}${d.weight_unit} × ${l.best.reps ?? '—'} · ${l.sessions} sessions</small></span>
      <span class="spark">${spark(l.series)}</span>
      <span class="delta ${cls}">${l.change == null ? '—' : `${sign}${l.change}${d.weight_unit}`}</span>
    </div>`;
  }).join('');
  return `<section class="panel"><h2>Lifts</h2>
    <p class="sub">Top set each session, and how it has moved across this stretch.</p>
    <div class="lifts">${rows}</div></section>`;
}

function spark(series) {
  if (series.length < 2) return '';
  const W = 84, H = 24;
  const vals = series.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const rng = (max - min) || 1;
  const x = i => (i / (series.length - 1)) * W;
  const y = v => H - 2 - ((v - min) / rng) * (H - 6);
  const line = series.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const area = `${line} L${W},${H} L0,${H} Z`;
  const up = vals[vals.length - 1] >= vals[0];
  const c = up ? 'var(--moss)' : 'var(--heat-3)';
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path d="${area}" fill="${c}" opacity=".13"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${x(series.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="2.2" fill="${c}"/>
  </svg>`;
}

function matrixPanel(m) {
  if (!m.muscles?.length) {
    return `<section class="panel"><h2>Training matrix</h2>
      <p class="empty">Log a few sessions and this fills in.</p></section>`;
  }
  const max = Math.max(1, ...m.grid.flatMap(w => Object.values(w.counts)));
  const band = c => c === 0 ? 'h0' : c / max <= .25 ? 'h1' : c / max <= .5 ? 'h2' : c / max <= .75 ? 'h3' : 'h4';

  return `<section class="panel"><h2>Training matrix</h2>
    <p class="sub">Sessions per muscle group, by week. The empty columns are the honest part.</p>
    <div class="mshell"><table class="matrix">
      <thead><tr><th class="rh">Muscle</th>${m.weeks.map(w => `<th>${esc(w.slice(5))}</th>`).join('')}</tr></thead>
      <tbody>${m.muscles.map(mu => `<tr>
        <td class="rh ${m.neglected.includes(mu) ? 'cold' : ''}">${esc(mu)}</td>
        ${m.grid.map(w => `<td><span class="cell ${band(w.counts[mu] || 0)}" title="${w.counts[mu] || 0} session(s)"></span></td>`).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="legend"><span>Cold iron</span>
      <span class="ramp"><span class="h0"></span><span class="h1"></span><span class="h2"></span><span class="h3"></span><span class="h4"></span></span>
      <span>Forging heat</span></div>
    ${m.neglected.length ? `<p class="sub" style="color:var(--heat-3)">Not touched in two weeks: ${esc(m.neglected.join(', '))}.</p>` : ''}
  </section>`;
}

// Food at every altitude: the week against the month against the year, the
// macro grid, and what the meals were actually made of. The last one is
// counted in meals rather than grams, because that is the only honest unit a
// described dinner supports.
function nutritionPanel(nu) {
  if (!nu?.totals) return '';
  const t = nu.totals;
  if (!t.all_time.meals) {
    return `<section class="panel"><h2>What you eat</h2>
      <p class="empty">Log a few meals and the whole picture builds itself from here.</p></section>`;
  }

  const row = (label, key, unit = '') => `<tr>
    <td>${esc(label)}</td>
    <td class="num" style="text-align:right">${n(t.today[key])}${unit}</td>
    <td class="num" style="text-align:right">${n(t.this_week[`${key}_per_day`])}${unit}</td>
    <td class="num" style="text-align:right">${n(t.this_month[`${key}_per_day`])}${unit}</td>
    <td class="num" style="text-align:right">${n(t.this_year[`${key}_per_day`])}${unit}</td>
  </tr>`;

  const grid = nu.macro_matrix?.rows?.length ? `
    <div class="mshell" style="margin-top:6px"><table class="matrix">
      <thead><tr><th class="rh">Per day</th>${nu.macro_matrix.weeks.map(w =>
        `<th>${esc(w.slice(5))}</th>`).join('')}</tr></thead>
      <tbody>${nu.macro_matrix.rows.map(r => `<tr>
        <td class="rh ${r.key === 'sugar_g' ? 'cold' : ''}">${esc(r.label)}
          <br><span style="color:var(--ash-dim);font-size:10.5px">${n(r.avg_per_day)} avg</span></td>
        ${r.cells.map(c => `<td><span class="cell ${c.band == null ? 'x' : 'h' + c.band}"
          title="${esc(c.week)}${c.value == null ? '' : ` · ${n(c.value)}/day`}"></span></td>`).join('')}
      </tr>`).join('')}</tbody>
    </table></div>` : '';

  const comp = nu.composition?.rows?.length ? `
    <p class="sub" style="margin-top:14px"><strong style="color:var(--bright)">What your meals are made of</strong> —
      counted in meals across the last 90 days, never in grams.</p>
    <div class="ledger">${nu.composition.rows.slice(0, 9).map(r => `
      <div class="lrow" style="grid-template-columns:78px 1fr 46px">
        <span class="lbl">${esc(r.category.replace('_', ' '))}</span>
        <span class="track"><span class="fill in" style="width:${r.share_pct}%"></span></span>
        <span class="val">${r.share_pct}%</span>
      </div>`).join('')}</div>` : '';

  const yoy = nu.year_over_year?.comparison
    ? callout('note', 'Against last year', esc(nu.year_over_year.comparison.say))
    : '';

  return `<section class="panel"><h2>What you eat</h2>
    <p class="sub">Per day, at every altitude. All of it estimated from what you described —
      read it as a direction, not a measurement.</p>
    <div class="mshell"><table class="matrix" style="border-spacing:0;min-width:340px">
      <thead><tr><th class="rh"></th>
        <th style="text-align:right">Today</th><th style="text-align:right">Week</th>
        <th style="text-align:right">Month</th><th style="text-align:right">Year</th></tr></thead>
      <tbody>
        ${row('Calories', 'calories')}
        ${row('Protein', 'protein_g', 'g')}
        ${row('Carbs', 'carbs_g', 'g')}
        ${row('Sugar', 'sugar_g', 'g')}
        ${row('Fibre', 'fibre_g', 'g')}
        ${row('Fat', 'fat_g', 'g')}
      </tbody>
    </table></div>
    ${grid}${comp}
  </section>${yoy}`;
}

// Everything the watch collects, on the same grid as training — but on the
// second scale. Effort runs hot, recovery runs cool. Using one ramp for both
// would mean a red-hot resting heart rate row reading as a good week.
function devicePanel(dm) {
  if (!dm?.rows?.length) {
    return `<section class="panel"><h2>From your devices</h2>
      <p class="empty">${esc(dm?.say || 'No device data yet — connect a watch and this fills in overnight.')}</p></section>`;
  }
  const cols = dm.days.length;
  const step = cols > 60 ? Math.ceil(cols / 60) : 1;   // keep it readable over a year
  const idx = dm.days.map((_, i) => i).filter(i => i % step === 0);

  const rows = dm.rows.map(r => `<tr>
    <td class="rh">${esc(r.label)}<br><span style="color:var(--ash-dim);font-size:10.5px">${
      r.metric === 'sleep_minutes' ? `${Math.round(r.avg / 60 * 10) / 10}h avg`
      : `${n(r.avg)} avg`}</span></td>
    ${idx.map(i => {
      const c = r.cells[i];
      const cls = c.band == null ? 'x' : (r.scale === 'recovery' ? 'c' : 'h') + c.band;
      return `<td><span class="cell ${cls}" title="${esc(c.date)}${c.value == null ? ' · no data' : ` · ${n(Math.round(c.value))}`}"></span></td>`;
    }).join('')}
  </tr>`).join('');

  return `<section class="panel"><h2>From your devices</h2>
    <p class="sub">Effort runs hot, recovery runs cool — two scales, because a red-hot
      resting heart rate would read as a good week when it means the opposite.
      Shading is against your own range, never anybody else's.</p>
    <div class="mshell"><table class="matrix">
      <thead><tr><th class="rh">Metric</th>${idx.map(i =>
        `<th>${esc(dm.days[i].slice(5))}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend" style="gap:16px">
      <span style="display:flex;align-items:center;gap:7px">Recovery
        <span class="ramp"><span class="c0"></span><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></span>
        better</span>
      <span style="display:flex;align-items:center;gap:7px">Effort
        <span class="ramp"><span class="h0"></span><span class="h1"></span><span class="h2"></span><span class="h3"></span><span class="h4"></span></span>
        harder</span>
    </div>
  </section>`;
}

// Averages hide the shape of a life. "You sleep 6h48m" is useless; "you sleep
// five and a half hours on Sunday nights" is something somebody can act on.
function weekPanel(wk) {
  if (!wk?.rows?.length) return '';
  const maxSleep = Math.max(...wk.rows.map(r => r.sleep_minutes || 0)) || 1;
  const bars = wk.rows.map(r => `<div class="lrow" style="grid-template-columns:38px 1fr 66px">
    <span class="lbl">${esc(r.day)}</span>
    <span class="track"><span class="fill" style="width:${((r.sleep_minutes || 0) / maxSleep * 100).toFixed(1)}%;
      background:${r.trained_pct > 0 ? 'linear-gradient(90deg,var(--temper-dk),var(--temper))' : 'var(--heat-1)'}"></span></span>
    <span class="val">${r.sleep_minutes ? `${Math.floor(r.sleep_minutes / 60)}h${String(r.sleep_minutes % 60).padStart(2, '0')}` : '—'}</span>
  </div>`).join('');

  return `<section class="panel"><h2>The shape of your week</h2>
    <p class="sub">Average sleep by day. Bars in blue are days you train on; amber are days you never do.</p>
    <div class="ledger">${bars}</div>
    ${wk.findings?.length
      ? wk.findings.map(f => `<p class="sub" style="color:var(--bright)">${esc(f.say)}</p>`).join('')
      : `<p class="sub">${esc(wk.say)}</p>`}
  </section>`;
}

function sessionsPanel(d) {
  const rows = (d.sessions || []).map(x =>
    `<div class="row"><span>${esc(x.name)} <span class="chip">${esc(x.kind)}</span></span>
     <span class="when">${x.days_ago === 0 ? 'today' : `${x.days_ago}d ago`}${x.minutes ? ` · ${x.minutes}m` : ''}</span></div>`).join('');
  return `<section class="panel"><h2>Recent sessions</h2>
    <div class="rows">${rows || '<p class="empty">No finished sessions yet.</p>'}</div></section>`;
}

function routinesPanel(d) {
  const rows = (d.routines || []).map(r => {
    const stale = r.days_since != null && r.days_since >= 7;
    return `<div class="row"><span>${esc(r.name)} <span class="chip ${stale ? 'stale' : ''}">${r.exercises} lifts</span></span>
      <span class="when">${r.days_since == null ? 'never run' : r.days_since === 0 ? 'today' : `${r.days_since}d ago`}</span></div>`;
  }).join('');
  return `<section class="panel"><h2>Routines</h2>
    <div class="rows">${rows || '<p class="empty">Say "remember this as my leg day" after a good session.</p>'}</div></section>`;
}

function notesPanel(d) {
  return `<section class="panel"><h2>From the rack</h2>
    <p class="sub">What you said mid-set. Usually the thing that explains a number later.</p>
    <div class="rows">${d.notes.map(x =>
      `<div class="row"><span class="quote">“${esc(x.note)}”<br>
        <span class="chip" style="margin-top:4px;display:inline-block">${esc(x.exercise)}</span></span>
       <span class="when">${esc(x.date.slice(5))}</span></div>`).join('')}</div></section>`;
}

boot();
</script>
